name: sab

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Published on localhost only, so the backend can also run outside Docker.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sab}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_SPACE_URL: ${HF_SPACE_URL:-https://ivannm-qwen-image-edit-2509-loras-fast2-copy.hf.space}
      HF_API_NAME: ${HF_API_NAME:-infer}
      HF_TIMEOUT_SECONDS: ${HF_TIMEOUT_SECONDS:-300}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - image_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # Used by the browser, so it must be the backend's address on the host.
      PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  image_data:
